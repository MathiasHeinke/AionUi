# Phase A is an unsigned, non-distributable Windows proof. Extend the shared
# product config so the proof remains on the same source, packaging and update-
# metadata path. scripts/build-with-builder.js already passes --publish=never,
# which blocks uploads without suppressing the latest.yml parity evidence.
extends: packages/desktop/electron-builder.yml

extraMetadata:
  commandEvePhaseAUnsignedProof: true

# Keep latest.yml generation enabled for the cross-platform parity receipt, but
# make the packaged proof incapable of contacting the production update feed.
publish:
  provider: generic
  url: https://phase-a.invalid
  publishAutoUpdate: true
