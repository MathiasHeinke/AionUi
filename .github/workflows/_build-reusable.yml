name: Build Pipeline (Reusable)

on:
  workflow_call:
    inputs:
      matrix:
        description: 'Build matrix as JSON string (passed via fromJSON in caller)'
        type: string
        required: true
      ref:
        description: 'Git ref to checkout (leave empty to use the triggering commit)'
        type: string
        default: ''
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        type: boolean
        default: false
      append_commit_hash:
        description: 'Append short commit hash to artifact names'
        type: boolean
        default: false
      upload_installers_only:
        description: 'Only upload primary installers (exe/msi/dmg/deb), skip zip/yml/blockmap'
        type: boolean
        default: false
      windows_phase_a_proof:
        description: 'Run the unsigned Windows x64 Phase A convergence proof'
        type: boolean
        default: false
    secrets:
      COMMAND_EVE_PHASE_A_LICENSE:
        description: 'Dedicated disposable Phase A CEVE test-seat credential'
        required: false

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  AIONUI_HUB_TAG: 'dist-ebc6a2b'

jobs:
  code-quality:
    name: Code Quality
    runs-on: ${{ matrix.os }}
    if: ${{ !inputs.skip_code_quality }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.windows_phase_a_proof && fromJSON('["ubuntu-latest","macos-14","windows-2022"]') || fromJSON('["ubuntu-latest"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Verify exact Windows Phase A source
        if: inputs.windows_phase_a_proof
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$ACTUAL_SHA" = "$REQUESTED_REF"
          test "$ACTUAL_SHA" = "$TRIGGER_SHA"
          echo "Exact proof source verified: $ACTUAL_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        continue-on-error: ${{ !inputs.windows_phase_a_proof }}
        run: bun run postinstall

      - name: Run ESLint
        run: bun run lint

      - name: Check Prettier formatting
        run: bun run format:check

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run

      - name: Parse Windows Phase A PowerShell harness
        if: inputs.windows_phase_a_proof && runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/windows/run-phase-a-proof.ps1'),
            [ref]$Tokens,
            [ref]$ParseErrors
          )
          if ($ParseErrors.Count -gt 0) {
            $ParseErrors | ForEach-Object { Write-Error $_.Message }
            throw "Windows Phase A PowerShell parse failed with $($ParseErrors.Count) error(s)"
          }
          Write-Host 'Windows Phase A PowerShell parse passed.'

      - name: Write Windows Phase A cross-OS marker
        if: inputs.windows_phase_a_proof
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          mkdir -p reports/windows/phase-a/cross-os
          node -e 'const fs=require("node:fs"); const cp=require("node:child_process"); const os=process.env.RUNNER_OS_NAME; const productVersion=String(JSON.parse(fs.readFileSync("package.json","utf8")).version||""); const commandEveVersion=String(JSON.parse(fs.readFileSync("public/command-eve-brand.json","utf8")).version||""); if(!productVersion||commandEveVersion.replace(/^v/u,"")!==productVersion) throw new Error("Command EVE product version sources are not aligned"); const value={schema_version:"command-eve-windows-cross-os/v1",runner_os:os,source_commit:cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),product_version:productVersion,command_eve_version:commandEveVersion,status:"PASS",tsc:"PASS",lint:"PASS",format:"PASS",unit:"PASS",completion_sentinel:"WIN_CROSS_OS_COMPLETE"}; fs.writeFileSync(`reports/windows/phase-a/cross-os/${os}.json`,JSON.stringify(value,null,2)+"\n");'

      - name: Upload Windows Phase A cross-OS marker
        if: inputs.windows_phase_a_proof
        uses: actions/upload-artifact@v6
        with:
          name: windows-phase-a-g02-${{ runner.os }}
          path: reports/windows/phase-a/cross-os/${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: code-quality
    if: ${{ always() && (inputs.skip_code_quality || needs.code-quality.result == 'success') }}

    outputs:
      commit-short: ${{ steps.commit.outputs.short }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Verify exact Windows Phase A source
        if: inputs.windows_phase_a_proof
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$ACTUAL_SHA" = "$REQUESTED_REF"
          test "$ACTUAL_SHA" = "$TRIGGER_SHA"
          echo "Exact proof source verified: $ACTUAL_SHA"

      - name: Get commit hash
        id: commit
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "Commit: $SHORT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scope Defender exclusions to ephemeral Windows build paths
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          foreach ($Path in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            if ([string]::IsNullOrWhiteSpace($Path)) { continue }
            try { Add-MpPreference -ExclusionPath $Path -ErrorAction Stop }
            catch { Write-Warning "Unable to add Defender exclusion for $Path`: $($_.Exception.Message)" }
          }

      - name: Resolve pinned Command EVE AionCore source
        id: command-eve-aioncore
        shell: bash
        run: node scripts/aioncoreSourceBuild.cjs config "${{ matrix.platform }}" "$GITHUB_OUTPUT"

      - name: Checkout pinned Command EVE AionCore source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.command-eve-aioncore.outputs.repository }}
          ref: ${{ steps.command-eve-aioncore.outputs.commit }}
          path: .command-eve-aioncore-source
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pinned AionCore Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.command-eve-aioncore.outputs.rust_toolchain }}
          targets: ${{ steps.command-eve-aioncore.outputs.target }}

      - name: Fix Rust MSVC linker (Windows only)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue

      - name: Cache pinned Command EVE AionCore build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .command-eve-aioncore-source -> target
          shared-key: command-eve-aioncore-${{ matrix.platform }}-${{ steps.command-eve-aioncore.outputs.commit }}
          cache-on-failure: true

      - name: Build pinned Command EVE AionCore source
        shell: bash
        working-directory: .command-eve-aioncore-source
        env:
          AIONCORE_RUST_TARGET: ${{ steps.command-eve-aioncore.outputs.target }}
          AIONUI_EMBED_BUN: '1'
          BUN_VARIANT: default
          RUSTFLAGS: ${{ steps.command-eve-aioncore.outputs.rustflags }}
        run: cargo build --locked --release --target "$AIONCORE_RUST_TARGET" -p aionui-app

      - name: Bind pinned Command EVE AionCore binary
        shell: bash
        run: >-
          node scripts/aioncoreSourceBuild.cjs bind "${{ matrix.platform }}" "$GITHUB_ENV"
          ".command-eve-aioncore-source"

      # Restore Electron/Electron-Builder caches before any build-related install
      - name: Cache Electron artifacts
        id: electron-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-
            electron-cache-${{ matrix.platform }}-

      - name: Cache status
        run: echo "electron-cache-hit=${{ steps.electron-cache.outputs.cache-hit }}"

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: bun install --frozen-lockfile

      - name: Run postinstall
        continue-on-error: ${{ !inputs.windows_phase_a_proof }}
        run: bun run postinstall

      - name: Setup Windows native dependencies (for Windows only)
        if: startsWith(matrix.platform, 'windows')
        run: |
          bun install --global node-gyp

      - name: Install MSVC ARM64 toolchain (Windows ARM64 only)
        if: matrix.platform == 'windows-arm64'
        continue-on-error: true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 60
          shell: pwsh
          command: |
            choco install visualstudio2022buildtools --yes --params "'--add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --add Microsoft.VisualStudio.Component.Windows11SDK.22000 --includeRecommended --includeOptional'"

      - name: Setup Windows build environment (for Windows only)
        if: startsWith(matrix.platform, 'windows')
        run: |
          echo "Setting Windows SDK version for ConPty support"
          echo "WindowsTargetPlatformVersion=10.0.19041.0" >> $env:GITHUB_ENV

      - name: Setup MSBuild (for Windows only)
        if: startsWith(matrix.platform, 'windows')
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Rebuild native modules for Electron
        if: "!startsWith(matrix.platform, 'windows')"
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      - name: Print build configuration
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="
          echo "Platform: ${{ matrix.platform }}"
          echo "Target Architecture: ${{ matrix.arch }}"
          echo "Build Command: ${{ matrix.command }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "Ref: ${{ inputs.ref || '(default)' }}"
          echo "Commit: ${{ steps.commit.outputs.short }}"
          echo "=========================================="

      # macOS code signing certificate installation
      - name: Setup macOS code signing (macOS only)
        if: startsWith(matrix.platform, 'macos')
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp-keychain-password' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing code signing certificate..."

            # Create certificate file
            echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > certificate.p12

            # Create temporary keychain
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

            # Import certificate
            security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

            # Clean up certificate file
            rm certificate.p12

            echo "Certificate imported successfully"
          else
            echo "No certificate provided - building unsigned application"
            echo "To enable code signing, add BUILD_CERTIFICATE_BASE64 and P12_PASSWORD secrets"
          fi

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip pkg-config libsqlite3-dev fakeroot dpkg-dev rpm libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon-dev libxss1 libatspi2.0-dev libgtk-3-dev libxrandr2 libasound2-dev

      - name: Rebuild native modules for Electron (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        continue-on-error: false
        run: |
          $arch = "${{ matrix.arch }}"
          $electronVer = (node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')").Trim()

          Write-Host "=========================================="
          Write-Host "Rebuilding native modules for Electron $electronVer ($arch)"
          Write-Host "=========================================="

          # Strategy: Try prebuild-install first (faster, more reliable)
          # Fallback to electron-rebuild only if prebuild-install fails
          $success = $false

          # Step 1: Try prebuild-install (downloads prebuilt binaries)
          Write-Host ""
          Write-Host "[Step 1] Trying prebuild-install..."
          $prebuildResult = $null
          try {
          $prebuildResult = bun x --yes prebuild-install --runtime=electron --target=$electronVer --platform=win32 --arch=$arch --force 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ prebuild-install succeeded"
              $success = $true
            } else {
              Write-Host "⚠️ prebuild-install exited with code $LASTEXITCODE"
            }
          } catch {
            Write-Host "⚠️ prebuild-install failed: $_"
          }

          # Step 2: Verify or fallback to electron-rebuild
          $sqliteNode = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (-not (Test-Path $sqliteNode)) {
            Write-Host ""
            Write-Host "[Step 2] prebuild-install didn't produce binary, trying electron-rebuild..."
            try {
              bunx electron-rebuild -f -w better-sqlite3
              if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ electron-rebuild succeeded"
                $success = $true
              }
            } catch {
              Write-Host "❌ electron-rebuild failed: $_"
            }
          }

          # Final verification
          Write-Host ""
          Write-Host "Verifying native modules..."
          if (Test-Path $sqliteNode) {
            $size = [math]::Round((Get-Item $sqliteNode).Length / 1MB, 1)
            Write-Host "✅ better-sqlite3 found: $sqliteNode ($size MB)"
          } else {
            Write-Error "❌ better-sqlite3 native module not found at: $sqliteNode"
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "✅ All critical native modules verified"
          Write-Host "=========================================="
          exit 0
        env:
          npm_config_runtime: electron
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_disturl: https://electronjs.org/headers
          # Don't force build_from_source - let prebuild-install try first
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022

      - name: Prepare aioncore binary
        shell: bash
        run: node scripts/prepareAioncore.js
        env:
          # Version plus exact source repository/commit are pinned in package.json.
          # The source build hash is bound through GITHUB_ENV before preparation.
          AIONUI_BACKEND_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove Windows build failures are fatal
        if: matrix.platform == 'windows-x64'
        id: windows-false-green
        shell: pwsh
        run: |
          $PreviousSelftestValue = $env:BUILD_WITH_BUILDER_SELFTEST_FAIL
          $env:BUILD_WITH_BUILDER_SELFTEST_FAIL = '1'
          try {
            $Injected = Start-Process -FilePath node `
              -ArgumentList @('scripts/build-with-builder.js', 'x64', '--win', '--x64') `
              -NoNewWindow -Wait -PassThru
          } finally {
            if ($null -eq $PreviousSelftestValue) {
              Remove-Item Env:BUILD_WITH_BUILDER_SELFTEST_FAIL -ErrorAction SilentlyContinue
            } else {
              $env:BUILD_WITH_BUILDER_SELFTEST_FAIL = $PreviousSelftestValue
            }
          }
          $InjectedExitCode = $Injected.ExitCode
          if ($InjectedExitCode -eq 0) {
            throw 'False-green regression: injected Windows build failure returned exit code 0'
          }
          "exit_code=$InjectedExitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Injected build failed as required (exit $InjectedExitCode)"

      - name: Build with electron-builder (Windows)
        if: startsWith(matrix.platform, 'windows')
        id: windows-build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Command = $env:WINDOWS_BUILD_COMMAND
          Write-Host "Running Windows build command: $Command"
          Invoke-Expression $Command
          if ($LASTEXITCODE -ne 0) {
            throw "${{ matrix.platform }} build failed with exit code $LASTEXITCODE"
          }
          "result=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Windows build completed successfully"
        env:
          WINDOWS_BUILD_COMMAND: ${{ matrix.command }}
          # Node.js memory limit for vite bundling (prevents OOM during build)
          # Node.js 内存限制，防止 vite 打包时内存不足
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Target arch / 目标架构
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          # Native module compilation / 原生模块编译
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          # Phase A is unsigned. Never expose Apple or provider credentials to a Windows build.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          COMMAND_EVE_PHASE_A_UNSIGNED_BUILD: ${{ inputs.windows_phase_a_proof && '1' || '0' }}
          # Windows build flags / Windows 构建参数
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          WindowsTargetPlatformVersion: 10.0.19041.0
          _WIN32_WINNT: 0x0A00
          # CI flag & GitHub token / CI 标识与 GitHub Token
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Clean up any stale disk images before DMG creation (macOS only)
      # 清理可能残留的磁盘镜像，避免 hdiutil "Device not configured" 错误
      - name: Clean up stale disk images (macOS only)
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "Cleaning up any stale disk images..."
          # Detach any mounted disk images
          hdiutil info 2>/dev/null | grep '/dev/disk' | awk '{print $1}' | while read disk; do
            echo "Detaching $disk..."
            hdiutil detach "$disk" -force 2>/dev/null || true
          done
          # Clean up any temporary DMG files
          rm -f /tmp/*.dmg 2>/dev/null || true
          echo "Cleanup complete"

      # macOS: Build with notarization - DMG/notarization/staple failure = CI failure.
      # macOS: 构建并公证 - DMG/公证/装订失败 = CI 失败
      - name: Build with electron-builder (macOS)
        if: startsWith(matrix.platform, 'macos')
        id: macos-build
        shell: bash
        run: |
          set +e  # Handle errors manually

          # Run build command
          ${{ matrix.command }} 2>&1 | tee "${RUNNER_TEMP}/build.log"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          # Check if DMG was created (most important artifact)
          DMG_EXISTS=false
          if ls out/*.dmg 1>/dev/null 2>&1; then
            DMG_EXISTS=true
            echo "✅ DMG created successfully"
          fi

          # If build succeeded completely
          if [ $BUILD_EXIT_CODE -eq 0 ]; then
            echo "✅ Build completed successfully"
            echo "notarization_status=success" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Build failed - check if it's just notarization failure
          if [ "$DMG_EXISTS" = true ]; then
            # DMG exists but build failed - likely notarization issue
            if grep -qiE "notariz|staple" "${RUNNER_TEMP}/build.log"; then
              echo "❌ DMG created but notarization/staple verification failed"
              echo "notarization_status=failed" >> $GITHUB_OUTPUT
              echo "::error title=Notarization Failed::DMG was built, but **notarization or staple verification failed**."
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "## ❌ Notarization Blocked" >> $GITHUB_STEP_SUMMARY
              echo "DMG was built, but **notarization or staple verification failed**." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "This artifact must not be published because users would see Gatekeeper warnings." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Fix notarization/stapling, rebuild from a clean out/ directory, then publish." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          fi

          # DMG doesn't exist or other fatal error - fail CI
          echo "❌ Build failed - DMG was not created"
          echo "notarization_status=build_failed" >> $GITHUB_OUTPUT
          exit 1
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          APP_ID: ${{ secrets.APP_ID }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          identity: ${{ secrets.IDENTITY }}
          CSC_NAME: ${{ secrets.IDENTITY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target_arch: ${{ matrix.arch }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # Linux: Standard build without special error handling
      # Linux: 标准构建，无特殊错误处理
      - name: Build with electron-builder (Linux)
        if: startsWith(matrix.platform, 'linux')
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_wait_seconds: 60
          command: ${{ matrix.command }}
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target_arch: ${{ matrix.arch }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # macOS 钥匙串清理
      - name: Clean up keychain (macOS only)
        if: startsWith(matrix.platform, 'macos') && always()
        run: |
          if security list-keychains | grep -q build.keychain; then
            security delete-keychain build.keychain
            echo "Temporary keychain deleted"
          fi

      # macOS 构建失败通知
      # macOS build failure notification
      - name: Notify on macOS build failure
        if: startsWith(matrix.platform, 'macos') && failure()
        run: |
          echo "::error title=macOS Build Failed::Build failed. Check the logs for details."
          echo ""
          echo "❌ macOS Build Failed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Common causes:"
          echo "  • hdiutil/DMG creation failure (Device not configured)"
          echo "  • Code signing issues"
          echo "  • Notarization timeout"
          echo "  • Out of memory (OOM)"
          echo ""
          echo "Check the build logs above for the specific error."
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: List build artifacts
        if: success() || failure()
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD ARTIFACTS"
          echo "=========================================="
          if [ -d "out" ]; then
            ls -lh out/ || true
            echo "=========================================="
            echo "Total artifacts:"
            find out/ -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.zip" -o -name "*.yml" \) -exec basename {} \; || true
          else
            echo "No out directory found!"
          fi

      - name: Verify Command EVE Windows x64 package inventory
        if: success() && matrix.platform == 'windows-x64'
        shell: bash
        run: |
          node scripts/windows/verifyWindowsPackage.mjs \
            --out out \
            --require-python \
            --report reports/windows/phase-a/gates/WIN-G05-package-inventory.json

      - name: Inspect unsigned Windows Phase A candidate
        if: success() && inputs.windows_phase_a_proof && matrix.platform == 'windows-x64'
        id: windows-phase-a-candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Installers = @(Get-ChildItem -Path out -Filter 'Command EVE-*-win-x64.exe' -File)
          if ($Installers.Count -ne 1) {
            throw "Expected exactly one Command EVE Windows x64 installer, found $($Installers.Count)"
          }
          $Installer = $Installers[0]
          $Signature = Get-AuthenticodeSignature -LiteralPath $Installer.FullName
          $Os = Get-CimInstance Win32_OperatingSystem
          $Computer = Get-CimInstance Win32_ComputerSystem
          "installer=$($Installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signature_status=$($Signature.Status)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "os=$($Os.Caption)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "os_build=$($Os.BuildNumber)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ram_bytes=$([int64]$Computer.TotalPhysicalMemory)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cpu_count=$([Environment]::ProcessorCount)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Write Windows Phase A build gate receipts
        if: success() && inputs.windows_phase_a_proof && matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          & bun x tsx scripts/windows/prepareWindowsPhaseAGates.ts `
            --mode build `
            --out-dir reports/windows/phase-a/gates `
            --installer '${{ steps.windows-phase-a-candidate.outputs.installer }}' `
            --inventory reports/windows/phase-a/gates/WIN-G05-package-inventory.json `
            --injected-exit-code '${{ steps.windows-false-green.outputs.exit_code }}' `
            --signature-status '${{ steps.windows-phase-a-candidate.outputs.signature_status }}' `
            --os '${{ steps.windows-phase-a-candidate.outputs.os }}' `
            --os-build '${{ steps.windows-phase-a-candidate.outputs.os_build }}' `
            --ram-bytes '${{ steps.windows-phase-a-candidate.outputs.ram_bytes }}' `
            --cpu-count '${{ steps.windows-phase-a-candidate.outputs.cpu_count }}' `
            --test-mode windows-build-candidate `
            --reject-code WIN_BUILD_FAILED
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Verify desktop asar does not contain packages/web-cli/ contamination
      # 验证桌面 asar 没有被 web-cli 代码污染
      - name: Verify desktop asar isolation
        if: >-
          success() &&
          (!startsWith(matrix.platform, 'windows') || steps.windows-build.outputs.result == 'success')
        shell: bash
        run: |
          set -euo pipefail
          ASAR=$(find out -type f -name 'app.asar' -not -path '*node_modules*' | head -n 1 || true)
          if [ -z "$ASAR" ]; then
            echo "::notice::No app.asar found for ${{ matrix.platform }}, skipping isolation check"
            exit 0
          fi
          echo "Inspecting $ASAR for web-cli leakage..."
          LEAK_COUNT=$(bunx @electron/asar list "$ASAR" 2>/dev/null | grep -cE '^/packages/web-cli(/|$)' || true)
          if [ "$LEAK_COUNT" != "0" ]; then
            echo "::error::Desktop asar contains $LEAK_COUNT web-cli entries:"
            bunx @electron/asar list "$ASAR" | grep -E '^/packages/web-cli(/|$)' | head -20
            exit 1
          fi
          echo "✅ asar isolation verified: no packages/web-cli entries"

      # Upload artifacts when:
      # - Build succeeded (all platforms)
      # - macOS: notarization timeout but artifacts exist (handled in build step)
      # - Windows: only if windows-build step succeeded
      # 上传产物条件：
      # - 构建成功（所有平台）
      # - macOS: 公证超时但有产物（已在构建步骤中处理）
      # - Windows: 仅当 windows-build 步骤成功
      - name: Clean up non-installer artifacts
        if: >-
          inputs.upload_installers_only && success() &&
          (!startsWith(matrix.platform, 'windows') || steps.windows-build.outputs.result == 'success')
        shell: bash
        run: |
          echo "Removing non-installer files from out/ ..."
          rm -f out/*.blockmap out/*.zip out/*.yml out/builder-debug.yml 2>/dev/null || true
          echo "Remaining artifacts:"
          ls -lh out/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        if: >-
          success() &&
          (!startsWith(matrix.platform, 'windows') || steps.windows-build.outputs.result == 'success')
        with:
          name: ${{ inputs.append_commit_hash && format('{0}-{1}', matrix.artifact-name, steps.commit.outputs.short) || matrix.artifact-name }}
          path: |
            out/*.exe
            out/*.msi
            out/*.dmg
            out/*.deb
            out/*-win-*.zip
            out/*-mac-*.zip
            out/*.yml
            reports/windows/phase-a/gates/*.json
          if-no-files-found: error
          retention-days: ${{ inputs.windows_phase_a_proof && 1 || 7 }}

  windows-phase-a-lifecycle:
    name: Windows x64 Phase A Lifecycle
    runs-on: windows-2022
    timeout-minutes: 120
    needs: [code-quality, build]
    if: >-
      always() && inputs.windows_phase_a_proof &&
      needs.code-quality.result == 'success' && needs.build.result == 'success'

    steps:
      - name: Checkout exact proof source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Verify exact Windows Phase A source
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$ACTUAL_SHA" = "$REQUESTED_REF"
          test "$ACTUAL_SHA" = "$TRIGGER_SHA"
          echo "Exact proof source verified: $ACTUAL_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Scope Defender exclusions to ephemeral proof paths
        shell: pwsh
        run: |
          foreach ($Path in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            if ([string]::IsNullOrWhiteSpace($Path)) { continue }
            try { Add-MpPreference -ExclusionPath $Path -ErrorAction Stop }
            catch { Write-Warning "Unable to add Defender exclusion for $Path`: $($_.Exception.Message)" }
          }

      - name: Install proof dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall

      - name: Download exact Windows candidate
        uses: actions/download-artifact@v6
        with:
          pattern: windows-build-x64*
          path: phase-a-candidate
          merge-multiple: true

      - name: Download cross-OS gate markers
        uses: actions/download-artifact@v6
        with:
          pattern: windows-phase-a-g02-*
          path: reports/windows/phase-a/cross-os
          merge-multiple: true

      - name: Resolve exact candidate installer
        id: phase-a-installer
        shell: pwsh
        run: |
          $Installers = @(Get-ChildItem -Path phase-a-candidate -Filter 'Command EVE-*-win-x64.exe' -Recurse -File)
          if ($Installers.Count -ne 1) {
            throw "Expected exactly one downloaded Command EVE installer, found $($Installers.Count)"
          }
          "path=$($Installers[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore build-runner gate receipts
        shell: pwsh
        run: |
          $GateDirectory = 'reports/windows/phase-a/gates'
          New-Item -ItemType Directory -Path $GateDirectory -Force | Out-Null
          foreach ($Name in @('WIN-G03.json', 'WIN-G04.json', 'WIN-G05.json', 'WIN-G05-package-inventory.json')) {
            $ReceiptMatches = @(Get-ChildItem -Path phase-a-candidate -Filter $Name -Recurse -File)
            if ($ReceiptMatches.Count -ne 1) {
              throw "Expected exactly one downloaded $Name receipt, found $($ReceiptMatches.Count)"
            }
            Copy-Item -LiteralPath $ReceiptMatches[0].FullName -Destination (Join-Path $GateDirectory $Name) -Force
          }

      - name: Write Phase A state, contract, and cross-OS receipts
        id: phase-a-preconditions
        continue-on-error: true
        shell: pwsh
        run: |
          $Os = Get-CimInstance Win32_OperatingSystem
          $Computer = Get-CimInstance Win32_ComputerSystem
          & bun x tsx scripts/windows/prepareWindowsPhaseAGates.ts `
            --mode preconditions `
            --out-dir reports/windows/phase-a/gates `
            --cross-os-dir reports/windows/phase-a/cross-os `
            --os "$($Os.Caption)" `
            --os-build "$($Os.BuildNumber)" `
            --ram-bytes "$([int64]$Computer.TotalPhysicalMemory)" `
            --cpu-count "$([Environment]::ProcessorCount)" `
            --test-mode packaged-nsis-phase-a `
            --reject-code WIN_CONTRACT_REJECT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run packaged Windows Phase A proof
        if: steps.phase-a-preconditions.outcome == 'success'
        id: phase-a-proof
        continue-on-error: true
        shell: pwsh
        env:
          COMMAND_EVE_PHASE_A_LICENSE: ${{ secrets.COMMAND_EVE_PHASE_A_LICENSE }}
        run: |
          & scripts/windows/run-phase-a-proof.ps1 `
            -InstallerPath '${{ steps.phase-a-installer.outputs.path }}' `
            -GateDirectory 'reports/windows/phase-a/gates' `
            -EvidenceDirectory 'reports/windows/phase-a/runtime' `
            -BootstrapTimeoutSeconds 2400 `
            -RestartBootstrapTimeoutSeconds 600 `
            -TurnTimeoutSeconds 600 `
            -CreditProbeTimeoutSeconds 300
          exit $LASTEXITCODE

      - name: Upload Windows Phase A evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-phase-a-evidence-${{ needs.build.outputs.commit-short }}
          path: |
            reports/windows/phase-a/gates/*.json
            reports/windows/phase-a/runtime/**
            reports/windows/phase-a/cross-os/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Windows Phase A result
        if: always()
        shell: pwsh
        run: |
          $Failures = [System.Collections.Generic.List[string]]::new()
          if ('${{ steps.phase-a-preconditions.outcome }}' -ne 'success') {
            $Failures.Add('Phase A state/contract/cross-OS preconditions failed.')
          }
          if ('${{ steps.phase-a-proof.outcome }}' -ne 'success') {
            $Failures.Add('Packaged Windows Phase A lifecycle or cloud proof failed.')
          }
          if ($Failures.Count -gt 0) {
            throw ($Failures -join ' ')
          }

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [code-quality, build, windows-phase-a-lifecycle]
    if: always()

    steps:
      - name: Write build summary
        env:
          MATRIX: ${{ inputs.matrix }}
          WINDOWS_PHASE_A_PROOF: ${{ inputs.windows_phase_a_proof }}
          WINDOWS_PHASE_A_RESULT: ${{ needs.windows-phase-a-lifecycle.result }}
        run: |
          set -euo pipefail
          PLATFORMS=$(echo "$MATRIX" | jq -r '[.include[].platform] | join(", ")')

          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ref | \`${{ inputs.ref || '(default)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ needs.build.outputs.commit-short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platforms | $PLATFORMS |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows Phase A | ${{ needs.windows-phase-a-lifecycle.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "$WINDOWS_PHASE_A_PROOF" = "true" ] && [ "$WINDOWS_PHASE_A_RESULT" != "success" ]; then
            echo "::error::Windows Phase A proof was requested but did not succeed ($WINDOWS_PHASE_A_RESULT)"
            exit 1
          fi
