name: Command EVE Windows Phase B Lab
run-name: Command EVE Phase B ${{ inputs.memory_class }} ${{ inputs.runner_binding }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      workflow_commit:
        description: Exact lowercase private workflow commit SHA
        required: true
        type: string
      source_ref:
        description: Exact public source branch whose head is being tested
        required: true
        type: string
      source_commit:
        description: Exact lowercase commit SHA to test
        required: true
        type: string
      runner_binding:
        description: Controller-issued lowercase one-run binding
        required: true
        type: string
      runner_name:
        description: Controller-issued exact JIT runner name
        required: true
        type: string
      memory_class:
        description: Cloud PC memory class
        required: true
        type: choice
        options:
          - lowmem-8gb
          - normal-16gb

concurrency:
  group: command-eve-phase-b-${{ inputs.memory_class }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate private lab dispatch
    runs-on: ubuntu-latest
    outputs:
      runner_labels: ${{ steps.contract.outputs.runner_labels }}
    steps:
      - name: Enforce exact control and source contract
        id: contract
        shell: bash
        env:
          EXPECTED_CONTROL_REPOSITORY: MathiasHeinke/command-eve-windows-lab
          EXPECTED_SOURCE_REPOSITORY: MathiasHeinke/AionUi
          CONTROL_REPOSITORY: ${{ github.repository }}
          CONTROL_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          INPUT_WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
          MEMORY_CLASS: ${{ inputs.memory_class }}
          RUNNER_BINDING: ${{ inputs.runner_binding }}
          RUNNER_NAME: ${{ inputs.runner_name }}
          SOURCE_REPOSITORY: MathiasHeinke/AionUi
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$CONTROL_REPOSITORY" = "$EXPECTED_CONTROL_REPOSITORY"
          test "$CONTROL_REPOSITORY_PRIVATE" = "true"
          test "$SOURCE_REPOSITORY" = "$EXPECTED_SOURCE_REPOSITORY"
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$SOURCE_REF" != -* && "$SOURCE_REF" != /* && "$SOURCE_REF" != */ ]]
          [[ "$SOURCE_REF" != *..* && "$SOURCE_REF" != *//* ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_COMMIT" = "$INPUT_WORKFLOW_COMMIT"
          [[ "$RUNNER_BINDING" =~ ^[0-9a-f]{32}$ ]]
          case "$MEMORY_CLASS" in
            lowmem-8gb) memory_label=phase-b-lowmem; memory_name=lowmem ;;
            normal-16gb) memory_label=phase-b-normal; memory_name=normal ;;
            *) exit 1 ;;
          esac
          expected_runner_name="command-eve-phase-b-${memory_name}-${RUNNER_BINDING:0:12}"
          test "$RUNNER_NAME" = "$expected_runner_name"
          printf 'runner_labels=["self-hosted","Windows","X64","command-eve-phase-b","%s","ceve-bind-%s"]\n' \
            "$memory_label" "$RUNNER_BINDING" >>"$GITHUB_OUTPUT"

  bootstrap:
    name: Bootstrap ${{ inputs.memory_class }}
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner_labels) }}
    timeout-minutes: 240
    steps:
      - name: Verify exact JIT runner and workflow run binding
        shell: powershell
        env:
          EXPECTED_RUNNER_BINDING: ${{ inputs.runner_binding }}
          EXPECTED_RUNNER_NAME: ${{ inputs.runner_name }}
        run: |
          if ($env:RUNNER_NAME -cne $env:EXPECTED_RUNNER_NAME) {
            throw 'Assigned runner name does not match the controller-issued JIT runner.'
          }
          $expectedRef = "refs/tags/command-eve-phase-b-$($env:EXPECTED_RUNNER_BINDING)"
          if ($env:GITHUB_REF_TYPE -cne 'tag' -or $env:GITHUB_REF -cne $expectedRef) {
            throw 'Workflow run is not bound to the controller-issued private workflow tag.'
          }

      - name: Verify standard-user bootstrap prerequisites
        shell: powershell
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            throw 'Git for Windows is required before the JIT workflow starts.'
          }
          git --version
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [System.Security.Principal.WindowsPrincipal]::new($identity)
          $administratorSid = [System.Security.Principal.SecurityIdentifier]::new('S-1-5-32-544')
          if ($principal.IsInRole($administratorSid)) {
            throw 'The Phase B workflow must run with a non-elevated standard-user token.'
          }

      - name: Checkout exact public source commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: MathiasHeinke/AionUi
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify exact clean source
        shell: powershell
        env:
          EXPECTED_SHA: ${{ inputs.source_commit }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SHA) { throw "Source SHA mismatch." }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) { throw "Source tree is dirty." }

      - name: Parse Phase B PowerShell
        shell: powershell
        run: |
          $scripts = @(
            '.github/scripts/windows/phase-b/collect-machine-facts.ps1',
            '.github/scripts/windows/phase-b/collect-runner-policy.ps1',
            '.github/scripts/windows/phase-b/download-runner-archive.ps1',
            '.github/scripts/windows/phase-b/run-jit-runner.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $script" }
          }

      - name: Collect machine and runner policy facts
        shell: powershell
        env:
          COMMAND_EVE_SOURCE_REPOSITORY: MathiasHeinke/AionUi
          MEMORY_CLASS: ${{ inputs.memory_class }}
        run: |
          $evidence = 'reports/windows/phase-b/bootstrap'
          & .github/scripts/windows/phase-b/collect-machine-facts.ps1 `
            -OutputPath "$evidence/machine-facts.json"
          & .github/scripts/windows/phase-b/collect-runner-policy.ps1 `
            -OutputPath "$evidence/runner-policy.json" `
            -MemoryClass $env:MEMORY_CLASS

      - name: Install pinned Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install exact dependencies
        shell: powershell
        run: bun install --frozen-lockfile

      - name: Validate machine and runner policy receipts
        shell: powershell
        env:
          CONTROL_REPOSITORY: ${{ github.repository }}
          MEMORY_CLASS: ${{ inputs.memory_class }}
          RUNNER_BINDING: ${{ inputs.runner_binding }}
          RUNNER_NAME: ${{ inputs.runner_name }}
          SOURCE_REPOSITORY: MathiasHeinke/AionUi
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
        run: |
          bun .github/scripts/windows/phase-b/validate-phase-b-evidence.ts `
            --machine-facts reports/windows/phase-b/bootstrap/machine-facts.json `
            --runner-policy reports/windows/phase-b/bootstrap/runner-policy.json `
            --memory-class $env:MEMORY_CLASS `
            --expected-control-repository $env:CONTROL_REPOSITORY `
            --expected-source-repository $env:SOURCE_REPOSITORY `
            --expected-source-ref $env:SOURCE_REF `
            --expected-source-commit $env:SOURCE_COMMIT `
            --expected-workflow-commit $env:WORKFLOW_COMMIT `
            --expected-runner-binding $env:RUNNER_BINDING `
            --expected-runner-name $env:RUNNER_NAME `
            --output-directory reports/windows/phase-b/bootstrap/receipts

      - name: Run Phase B bootstrap regressions
        shell: powershell
        run: >-
          bun run test --
          tests/unit/command-eve/windows/phaseBMachineReceiptCore.test.ts
          tests/unit/command-eve/windows/phaseBRunnerPolicyCore.test.ts
          tests/unit/command-eve/windows/phaseBBootstrapContract.test.ts
          --reporter=verbose

      - name: Type-check shared desktop source
        shell: powershell
        run: bunx tsc --noEmit

      - name: Upload redacted bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-phase-b-bootstrap-${{ inputs.runner_binding }}
          path: reports/windows/phase-b/bootstrap/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
